name: Sync Upstream Release

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout Fork Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Check Upstream Latest Release
        id: check_release
        run: |
          UPSTREAM_REPO="MengMengCode/VoCat"

          UPSTREAM_TAG=$(curl -s "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest" | jq -r .tag_name)

          if [ "$UPSTREAM_TAG" = "null" ] || [ -z "$UPSTREAM_TAG" ]; then
            echo "new_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if git rev-parse "$UPSTREAM_TAG" >/dev/null 2>&1; then
            echo "new_release=false" >> $GITHUB_OUTPUT
          else
            echo "new_release=true" >> $GITHUB_OUTPUT
            echo "tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
          fi

      - name: Sync Code and Tag from Upstream
        if: steps.check_release.outputs.new_release == 'true'
        run: |
          UPSTREAM_REPO="MengMengCode/VoCat"
          TAG="${{ steps.check_release.outputs.tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" || true
          git fetch upstream --tags

          git merge upstream/master --ff-only || git merge upstream/master -m "Sync upstream release $TAG"
          git push origin HEAD

          git push origin "$TAG"

      - name: Trigger dockerhub-multi.yml
        if: steps.check_release.outputs.new_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.check_release.outputs.tag }}"

          gh workflow run dockerhub-multi.yml \
            --repo "${{ github.repository }}" \
            -f tag="$TAG"